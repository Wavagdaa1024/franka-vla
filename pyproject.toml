[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-midterm"
version = "0.1.0"
description = "Franka Panda VLA deployment, LoRA fine-tuning, and obstacle avoidance system with LeRobot integration"
authors = [{ name = "Midterm Team" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy",
    "pyrealsense2",
    "opencv-python",
    "pyarrow",
    "transformers",
    "accelerate",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["franka_teleop*", "obstacle_avoidance*", "vlm_planning*"]
